server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones a la API se reenvían al contenedor del backend ("api" es
    # su nombre en docker-compose). Así el navegador usa un solo origen.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Rutas de Angular: cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
